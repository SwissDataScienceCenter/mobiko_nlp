# /etc/nginx/conf.d/default.conf — static graph viewer behind basic auth.
# start.sh writes /tmp/htpasswd from the environment before nginx starts.
server {
  listen 8000;
  server_name _;
  # Behind the RunAI ingress the public port is not 8000; relative redirects
  # keep the browser on the address it used.
  absolute_redirect off;

  gzip on;
  gzip_types application/javascript text/css application/json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;

  # Health endpoint — no auth
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /graph/ {
    alias /usr/share/nginx/html/;
    index index.html;
    auth_basic "MoBiKo graphs";
    auth_basic_user_file /tmp/htpasswd;
    # Pages change on every rebuild; always revalidate.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location = / {
    return 302 /graph/;
  }

  location = /graph {
    return 302 /graph/;
  }
}
