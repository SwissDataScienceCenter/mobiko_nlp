# /etc/nginx/conf.d/streamlit.conf
upstream streamlit_upstream {
  server 127.0.0.1:8502;
}

server {
  listen 8000;
  server_name _;
  client_max_body_size 100m;

  # Health endpoint — no auth
  location = /health {
    proxy_pass http://127.0.0.1:8000;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # App under /annotate/ — protect with basic auth
  location /annotate/ {
    proxy_pass http://streamlit_upstream/annotate/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    auth_basic "Restricted";
    auth_basic_user_file /mydata/mobiko/anisia/deploy_annotate/htpasswd;
  }

  # Everything else -> redirect to /annotate/
  location / {
    return 301 /annotate/;
  }
}
