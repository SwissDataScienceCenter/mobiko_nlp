# nginx.conf
# Streamlit is on localhost:8502 (match your start.sh)
upstream streamlit_upstream { server 127.0.0.1:8502; }

# Turn off auth for health endpoints only (keep it for the app)
map $request_uri $require_auth {
  default    1;
  ~^/$       0;
  ~^/health$ 0;
}

# Reusable server: listen on 80 and 8012 (duplicate blocks)

server {
  listen 8000;
  server_name _;

  if ($require_auth) {
    auth_basic           "User login";
    auth_basic_user_file /mydata/mobiko/anisia/deploy_annotate/htpasswd;
  }

  # Readiness
  location = /health { return 200 "ok\n"; }
  location = /       { return 200 "ok\n"; }

  # Streamlit behind subpath /annotate (no trailing slash rewrite needed; Streamlit gets baseUrlPath)
  location /annotate {
    proxy_pass http://127.0.0.1:8502;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_read_timeout      86400;
  }

  # WebSocket endpoint when Streamlit uses a subpath
  location /annotate/_stcore/stream {
    proxy_pass              http://127.0.0.1:8502/_stcore/stream;
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_read_timeout      86400;
  }
}

